name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - src/MimeDetective.Web/**
      - src/MimeDetective/**
      - src/MimeDetective.Definitions.Condensed/**
      - src/MimeDetective.Definitions.Exhaustive/**
      - src/Directory.Build.props
      - src/Directory.Packages.props
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish src/MimeDetective.Web/MimeDetective.Web.csproj -c Release -o publish

      - name: Keep GitHub Pages from skipping _framework
        run: touch publish/wwwroot/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
